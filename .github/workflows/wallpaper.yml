name: render wallpaper

# Tip-offs run from noon to 8pm Pacific and a game takes about two and a half
# hours, so a final lands somewhere between 2:30pm and 11pm. This polls every
# ten minutes across that whole window, in UTC wide enough to cover it under
# both PST and PDT, so the board catches up within about ten minutes of the
# buzzer. Nothing is gated on the clock: GitHub treats cron as best effort and
# an earlier version threw away a run that arrived seven hours late. Nothing is
# wasted either - "Commit if changed" writes nothing when the picture has not
# moved, which is what most of these runs will find. The repository is public,
# so the minutes are free.
on:
  schedule:
    - cron: "*/10 21-23 * * *"    # evening games, through midnight Pacific
    - cron: "*/10 0-7 * * *"      # the rest of the night either side of DST
    - cron: "0 14,15 * * *"       # a morning backstop, ~6am Pacific
  workflow_dispatch:
  # A change to how the wallpaper is drawn should show up on the phone without
  # waiting for the next cron. The bot's own wallpaper commits use the default
  # GITHUB_TOKEN, which by design does not re-trigger workflows, so this cannot
  # loop; the paths filter keeps it to commits that can change the image.
  push:
    branches: [main]
    paths:
      - "lakerscreen/**"
      - "assets/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/wallpaper.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Oswald
        # Closest free match to the reference lettering; macOS's Avenir Next
        # Condensed is not redistributable and does not exist on the runner.
        run: curl -sL -o oswald.ttf
          "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf"

      - name: Render
        # PIN_MONTH pins the wallpaper to one month (YYYY-MM) for previewing a
        # month that is not the current one. Unset the repository variable and
        # the next run goes back to tracking today's month on its own.
        # BACKGROUND does the same for the backdrop.
        run: |
          python generate.py \
            ${PIN_MONTH:+--month "$PIN_MONTH"} \
            ${BACKGROUND:+--bg "$BACKGROUND"} \
            --device "${DEVICE:-iphone-17-pro}" \
            --font oswald.ttf \
            --font-variation Bold --font-variation-light Regular \
            --ttl 0 \
            -o docs/wallpaper.png
          echo "rendered ${PIN_MONTH:-current month}"
        env:
          DEVICE: ${{ vars.DEVICE }}
          PIN_MONTH: ${{ vars.PIN_MONTH }}
          # A hex colour such as "#000000", or a path to an image. Unset the
          # repository variable and the next run goes back to the photo.
          BACKGROUND: ${{ vars.BACKGROUND }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wallpaper.png
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "wallpaper: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
