name: render wallpaper

# Wanted: 10pm and 10am Pacific. Cron only speaks UTC and does not follow
# daylight saving, so a fixed pair of hours drifts by one every spring and
# autumn. Instead this fires at the UTC hours that cover both halves of the
# year - 05/17 while the coast is on PDT, 06/18 on PST - and the "Pacific
# hour" job below drops whichever pair is an hour off today. Two of the four
# run; the other two stop in a couple of seconds.
on:
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch:
  # A change to how the wallpaper is drawn should show up on the phone without
  # waiting for the next cron. The bot's own wallpaper commits use the default
  # GITHUB_TOKEN, which by design does not re-trigger workflows, so this cannot
  # loop; the paths filter keeps it to commits that can change the image.
  push:
    branches: [main]
    paths:
      - "lakerscreen/**"
      - "assets/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/wallpaper.yml"

permissions:
  contents: write

jobs:
  # Scheduled runs only go ahead on the hour that is actually 10pm or 10am in
  # Los Angeles. A push or a manual run is never gated.
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.hour.outputs.go }}
    steps:
      - id: hour
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: running."
            exit 0
          fi
          h=$(TZ=America/Los_Angeles date +%H)
          if [ "$h" = "22" ] || [ "$h" = "10" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "${h}:00 in Los Angeles: running."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "${h}:00 in Los Angeles is neither 10am nor 10pm: stopping."
          fi

  render:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Oswald
        # Closest free match to the reference lettering; macOS's Avenir Next
        # Condensed is not redistributable and does not exist on the runner.
        run: curl -sL -o oswald.ttf
          "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf"

      - name: Render
        # PIN_MONTH pins the wallpaper to one month (YYYY-MM) for previewing a
        # month that is not the current one. Unset the repository variable and
        # the next run goes back to tracking today's month on its own.
        # BACKGROUND does the same for the backdrop.
        run: |
          python generate.py \
            ${PIN_MONTH:+--month "$PIN_MONTH"} \
            ${BACKGROUND:+--bg "$BACKGROUND"} \
            --device "${DEVICE:-iphone-17-pro}" \
            --font oswald.ttf \
            --font-variation Bold --font-variation-light Regular \
            --ttl 0 \
            -o docs/wallpaper.png
          echo "rendered ${PIN_MONTH:-current month}"
        env:
          DEVICE: ${{ vars.DEVICE }}
          PIN_MONTH: ${{ vars.PIN_MONTH }}
          # A hex colour such as "#000000", or a path to an image. Unset the
          # repository variable and the next run goes back to the photo.
          BACKGROUND: ${{ vars.BACKGROUND }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wallpaper.png
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "wallpaper: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
